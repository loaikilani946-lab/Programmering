<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Intro</title>
</head>
<body>
  <script src="http://koda.nu/simple.js">
    // Skriv din kod här
    var player = { x: 100, y: 300, size: 20, color: "blue", speed: 4 };

var zombie1 = { x: 300, y: 220, speed: 50 };
var zombie2 = { x: 500, y: 400, speed: 1 };
var zombie3 = { x: 700, y: 260, speed: 1 };
var zombie4 = { x: 900, y: 500, speed: 1 };

// STEG 1a: skriv funktionen drawZombie här
function drawZombie(x, y) {
    rectangle(x + 3, y - 10, 23, 65 ,"lightgreen");
    rectangle(x + 3, y - 25, 23, 65, "grey");
    circle(x + 15, y - 40, 20, "lightgreen");
    circle(x, y - 40, 3, "red");
    rectangle(x - 35, y - 20, 30, 14, "lightgreen");
    rectangle(x - 20, y - 20, 30, 14, "grey")
  }
  function drawPlayer() {
    circle(player.x, player.y, player.size, player.color);
    circle(player.x - 10, player.y, 5, "red")
    circle(player.x + 10, player.y, 5, "red")
  }

  

function update() {
  clearScreen();
  text(20, 30, 24, "Zombiespelet", "black");

  // STEG 1b: rita de tre zombierna här
  drawZombie(zombie1.x, zombie1.y)
  drawZombie(zombie2.x, zombie2.y)
  drawZombie(zombie3.x, zombie3.y)
  drawZombie(zombie4.x, zombie4.y)
  drawPlayer()


  // circle(player.x, player.y, player.size, player.color);

  if (keyboard.right) {
    player.x = player.x + player.speed;
  }
  if (keyboard.left) {
    player.x = player.x - player.speed;
  }
  if (keyboard.up) {
    player.y = player.y - player.speed;
  }
  if (keyboard.down) {
    player.y = player.y + player.speed;
  }
  
  if (keyboard.d) {
    zombie1.x = zombie1.x + zombie1.speed;
  }
  if (keyboard.a) {
    zombie1.x = zombie1.x - zombie1.speed;
  }
  if (keyboard.w) {
    zombie1.y = zombie1.y - zombie1.speed;
  }
  if (keyboard.s) {
    zombie1.y = zombie1.y + zombie1.speed;
  }
  

  // STEG 2: träffkollen kommer här
  if (distance(player, zombie1) < 65 ) {
    text(20, 70, 30, "AJ!", "red")
    stopUpdate()
    window.location.reload()
  }

  if (distance(player, zombie2) < 65) {
    text(20, 70, 30, "AJ!", "red")
    alert("spelet är slut!")
  }
  if (distance( player, zombie3) < 65) {
    text(20, 70, 30, "AJ!", "red")
    window.location.reload()
  }
  if (distance( player, zombie4) < 65) {
    text(20, 70, 30, "AJ!", "red")
    player.x = 100
    player.y = 300
   }
    
   if(zombie2.x < player.x) {
      zombie2.x = zombie2.x + zombie2.speed;
  }
  if(zombie2.x > player.x) {
      zombie2.x = zombie2.x - zombie2.speed;
  }
  if(zombie1.y < player.y) {
      zombie2.y = zombie2.y + zombie2.speed;
  }
  if(zombie2.y > player.y) { 
      zombie2.y = zombie2.y - zombie2.speed;
  }

 

// console.log(distance(player, zombie1))




}

























  </script>
</body>
</html>
