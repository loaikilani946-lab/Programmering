<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Intro</title>
</head>
<body>
  <script src="http://koda.nu/simple.js">
    
    var playerX = 400;
    var playerY = 300;

    function update(){
        fill("black");
        circle(playerX, playerY, 20, "lime");
        if (keyboard.right){
            playerX = playerX + 5;
        }

        if (keyboard.left) {
            playerX = playerX - 5;
        }





    }
  



















    
  </script>
</body>
</html>
